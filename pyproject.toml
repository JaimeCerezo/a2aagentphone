[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "a2aagentphone"
version = "0.3.7"
description = "Give a Claude Code agent a phone number: answer A2A calls, and place them."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
keywords = ["a2a", "agent", "claude", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "a2a-sdk[http-server]>=1.0",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "mcp>=2.0",
]

[project.scripts]
a2aagentphone = "a2aagentphone.server:main"
a2aagentphone-mcp = "a2aagentphone.mcp:main"
a2aagentphone-admin = "a2aagentphone.admin:main"
a2aagentphone-note = "a2aagentphone.note:main"
a2aagentphone-log = "a2aagentphone.logcli:main"

[project.urls]
Homepage = "https://github.com/JaimeCerezo/a2aagentphone"

[tool.hatch.build.targets.wheel]
packages = ["a2aagentphone"]
